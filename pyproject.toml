[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k4-day08-rag-pipeline"
version = "0.1.0"
description = "Day 8 lab for building and evaluating a RAG pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=0.40.0,<2",
    "chromadb>=0.5.0,<2",
    "crawl4ai==0.9.3",
    "datasets>=4.0.0,<6",
    "fpdf2>=2.7.0,<3",
    "google-genai>=1.0.0,<3",
    "langchain-community==0.4.1",
    "langchain-openai>=1.6.2,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "markitdown[pdf,docx]>=0.1.0,<0.2",
    # numpy phải <2: PyTorch 2.2.x build trên numpy 1.x ABI. Trên macOS x86_64
    # (Intel) torch không có wheel nào mới hơn 2.2.2, nên không thể nâng torch
    # để dùng numpy 2. Nâng numpy lên 2.x gây "Failed to initialize NumPy:
    # _ARRAY_API not found" rồi NameError khi import transformers.
    "numpy>=1.26.0,<2",
    "openai>=2.45.0,<3",
    "pageindex==0.2.8",
    "python-dotenv>=1.0.0,<2",
    "ragas==0.4.3",
    "rank-bm25>=0.2.2,<0.3",
    "requests>=2.31.0,<3",
    "scikit-learn>=1.3.0,<2",
    # sentence-transformers <4 và transformers <5: transformers 5.x đòi
    # torch>=2.5, không có trên macOS x86_64 (torch dừng ở 2.2.2). Khoảng cũ
    # ">=2.2.0,<7" quá lỏng nên pip kéo về 6.1.0 -> transformers 5.17 -> vỡ.
    # BAAI/bge-m3 chạy bình thường trên sentence-transformers 3.x.
    # Trần transformers <4.50: từ 4.50 trở đi transformers chặn torch.load
    # với torch < 2.6 (chốt CVE-2025-32434), kể cả khi weights_only=True.
    # Trên macOS x86_64 (Intel) torch không có wheel nào mới hơn 2.2.2, và
    # BAAI/bge-m3 không có bản safetensors trên HuggingFace, nên không thể
    # lách chốt này bằng cách nâng torch hay đổi định dạng checkpoint.
    "sentence-transformers>=3.0.0,<4",
    "transformers>=4.41.0,<4.50",
    "streamlit>=1.35.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
